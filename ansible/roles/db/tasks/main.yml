---
# roles/db/tasks/main.yml

- name: Install MariaDB 10.5 server (Amazon Linux 2023)
  become: true
  ansible.builtin.package:
    name: mariadb105-server
    state: present

- name: Enable and start MariaDB service
  become: true
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: yes

- name: Wait for MySQL socket to appear
  become: true
  ansible.builtin.wait_for:
    path: /var/lib/mysql/mysql.sock
    state: started
    timeout: 60

# ---------- INITIAL ROOT SETUP ----------
- name: Set MySQL root password (if not already set)
  become: true
  ansible.builtin.shell: >
    echo "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}';
    FLUSH PRIVILEGES;" | mysql -u root || true

# ---------- ALLOW ROOT ACCESS FROM ANY HOST ----------
- name: Create root user accessible from any host ('%')
  become: true
  ansible.builtin.shell: >
    mysql -u root -p'{{ mysql_root_password }}' -e
    "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;"

# ---------- DATABASE AND TABLE SETUP ----------
- name: Create SQL file for database + table
  become: true
  ansible.builtin.copy:
    dest: /tmp/init_crud.sql
    content: |
      CREATE DATABASE IF NOT EXISTS crud_react_node;
      USE crud_react_node;
      CREATE TABLE IF NOT EXISTS blogs (
          id INT AUTO_INCREMENT PRIMARY KEY,
          title VARCHAR(255) NOT NULL,
          content TEXT NOT NULL,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

- name: Apply SQL to initialize database
  become: true
  ansible.builtin.shell: >
    mysql -u root -p'{{ mysql_root_password }}' < /tmp/init_crud.sql

- name: Remove temp SQL file
  become: true
  ansible.builtin.file:
    path: /tmp/init_crud.sql
    state: absent

