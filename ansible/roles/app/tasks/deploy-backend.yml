---
- name: Install Node.js LTS
  shell: |
    curl -fsSL https://rpm.nodesource.com/setup_lts.x | bash -
    yum install -y nodejs
  args:
    creates: /usr/bin/node

- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: yes
    state: present

- name: Create backend application directory
  file:
    path: /var/www/backend
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Copy backend files to server
  copy:
    src: "{{ playbook_dir }}/artifacts/backend/"
    dest: /var/www/backend/
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Install backend dependencies
  shell: npm install --silent
  args:
    chdir: /var/www/backend

- name: Stop existing backend if running
  shell: |
    pm2 delete backend || true
  args:
    chdir: /var/www/backend
  ignore_errors: true

- name: Start backend with PM2
  shell: |
    pm2 start npm --name backend -- start
    pm2 save
    pm2 startup
  args:
    chdir: /var/www/backend