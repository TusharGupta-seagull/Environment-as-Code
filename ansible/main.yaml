---
# After this playbook runs, the bastion can:
#   - SSH into every application instance (via the generated ~/.ssh/config)
#   - Reach the RDS instance through the MySQL client (rds-mysql helper)
#
# The inventory, ssh_config and SSH key are generated by Terraform
# (terraform/config-mgmt) and passed to this playbook as extra vars.

- name: Provision bastion host for management access
  hosts: bastion
  become: true
  gather_facts: true

  tasks:
    - name: Install management tools
      ansible.builtin.dnf:
        name:
          - git
          - curl
          - jq
          - openssh-clients
          - mariadb105
        state: present
        update_cache: true

    - name: Ensure SSH directory for {{ ansible_user }}
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy SSH private key to bastion
      ansible.builtin.copy:
        src: "{{ ssh_key_src }}"
        dest: "/home/{{ ansible_user }}/.ssh/{{ ssh_key_name }}.pem"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Install ssh config for instance access
      ansible.builtin.copy:
        src: "{{ ssh_config_src }}"
        dest: "/home/{{ ansible_user }}/.ssh/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Install RDS MySQL helper script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Connect to the application RDS database from the bastion:
          #   rds-mysql <database-name>
          exec mysql -h {{ rds_endpoint | default('') }} -P {{ rds_port | default('3306') }} -u {{ rds_username | default('admin') }} -p "$@"
        dest: /usr/local/bin/rds-mysql
        owner: root
        group: root
        mode: "0755"
      when: rds_endpoint | default('') | length > 0

    - name: Verify SSH connectivity from bastion to app instances
      become: false
      ansible.builtin.command: ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 {{ item }} true
      loop: "{{ groups['app'] | default([]) }}"
      register: ssh_check
      changed_when: false
      ignore_errors: true
